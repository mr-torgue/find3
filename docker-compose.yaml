version: '3.8'

services:
  find3server: 
    #name: find3server
    build: .
    ports:
      - "1884:1883" 
      - "8005:8003" 
    environment:
      - MQTT_ADMIN:ADMIN
      - MQTT_PASS:PASSWORD
      - MQTT_SERVER:'localhost:1883'
      - MQTT_EXTERNAL:'10.0.0.13'
      - MQTT_PORT:1884
    volumes: 
      - /home/dev/FIND_DATA:/data
      - /home/dev/find3/settings/all-default0-threshold0.6.json:/app/ai/src/settings.json

